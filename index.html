<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake - Gold & Diamond Edition</title>
    <style>
        /* ==========================================================================
           1. CORE STYLES & CYBER THEME SETUP
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        :root {
            --bg-color: #03050d;
            --card-bg: rgba(10, 15, 30, 0.92);
            --primary-neon: #00f3ff;
            --secondary-neon: #ff007f;
            --accent-neon: #00ff66;
            --gold-neon: #ffd700;
            --diamond-neon: #00f3ff;
            --purple-neon: #a855f7;
            --text-color: #ffffff;
            --text-dim: #8b9bb4;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 243, 255, 0.1) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(255, 215, 0, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 10% 90%, rgba(255, 0, 127, 0.08) 0%, transparent 50%);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 10px;
        }

        .gold-symbol {
            font-weight: 900;
            color: var(--gold-neon);
            text-shadow: 0 0 8px var(--gold-neon);
            display: inline-block;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 420px;
            position: relative;
        }

        /* HUD PANEL */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: var(--card-bg);
            border: 2px solid rgba(0, 243, 255, 0.3);
            border-radius: 14px;
            padding: 10px 16px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.15);
            backdrop-filter: blur(8px);
        }

        .hud-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hud-label {
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 2px;
            font-weight: 700;
        }

        .hud-value {
            font-size: 18px;
            font-weight: 900;
            color: var(--primary-neon);
            text-shadow: 0 0 10px var(--primary-neon);
            font-family: monospace;
        }

        .hud-value.high-score {
            color: var(--secondary-neon);
            text-shadow: 0 0 10px var(--secondary-neon);
        }

        .hud-value.coins {
            color: var(--gold-neon);
            text-shadow: 0 0 10px var(--gold-neon);
        }

        /* CANVAS ARENA */
        .canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: rgba(4, 7, 18, 0.96);
            border: 2px solid var(--primary-neon);
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.25);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* OVERLAYS */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 6, 16, 0.93);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
            text-align: center;
            gap: 12px;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            display: none;
            opacity: 0;
            pointer-events: none;
        }

        .title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--primary-neon);
            text-shadow: 0 0 15px var(--primary-neon), 0 0 30px var(--primary-neon);
            font-family: Impact, sans-serif;
        }

        .subtitle {
            font-size: 11px;
            color: var(--gold-neon);
            letter-spacing: 5px;
            margin-top: -8px;
            font-weight: 800;
            text-shadow: 0 0 10px var(--gold-neon);
        }

        .instructions-badge {
            font-size: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px dashed rgba(0, 243, 255, 0.5);
            padding: 6px 12px;
            border-radius: 20px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .result-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 4px 0;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 80%;
        }

        .result-item {
            font-size: 13px;
            color: var(--text-color);
            display: flex;
            justify-content: space-between;
        }

        .new-high-badge {
            font-size: 11px;
            color: var(--secondary-neon);
            font-weight: bold;
            letter-spacing: 2px;
            animation: pulse 0.8s infinite alternate;
            text-shadow: 0 0 12px var(--secondary-neon);
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .btn {
            background: rgba(0, 243, 255, 0.1);
            color: var(--primary-neon);
            border: 2px solid var(--primary-neon);
            padding: 10px 22px;
            font-size: 12px;
            font-family: inherit;
            font-weight: 800;
            letter-spacing: 2px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.2);
            transition: all 0.2s ease;
        }

        .btn:hover, .btn:active {
            background: var(--primary-neon);
            color: #000;
            box-shadow: 0 0 20px var(--primary-neon);
            transform: translateY(-2px);
        }

        .btn-gold {
            background: rgba(255, 215, 0, 0.1);
            color: var(--gold-neon);
            border-color: var(--gold-neon);
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.2);
        }

        .btn-gold:hover, .btn-gold:active {
            background: var(--gold-neon);
            color: #000;
            box-shadow: 0 0 20px var(--gold-neon);
        }

        /* COSMETIC SHOP STYLES */
        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border-bottom: 1px solid rgba(0, 243, 255, 0.2);
            padding-bottom: 6px;
        }

        .preview-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--primary-neon);
            border-radius: 12px;
            padding: 6px;
            width: 100%;
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.15);
        }

        .preview-title {
            font-size: 9px;
            color: var(--text-dim);
            letter-spacing: 1.5px;
            margin-bottom: 4px;
            font-weight: bold;
        }

        #previewCanvas {
            background: #02040a;
            border-radius: 8px;
            border: 1px rgba(0, 243, 255, 0.3) solid;
        }

        .shop-tabs {
            display: flex;
            gap: 4px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
            margin: 2px 0;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: var(--text-dim);
            padding: 5px 8px;
            font-size: 9px;
            font-weight: 800;
            font-family: inherit;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary-neon);
            color: #000;
            border-color: var(--primary-neon);
            box-shadow: 0 0 10px var(--primary-neon);
        }

        .shop-items-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
            max-height: 170px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .shop-items-grid::-webkit-scrollbar {
            width: 4px;
        }
        .shop-items-grid::-webkit-scrollbar-thumb {
            background: var(--primary-neon);
            border-radius: 4px;
        }

        .shop-item-card {
            background: rgba(18, 25, 48, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .shop-item-card.selected-preview {
            border-color: var(--gold-neon);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
            background: rgba(35, 45, 80, 0.9);
        }

        .shop-item-card.equipped {
            border-color: var(--accent-neon);
        }

        .item-name {
            font-size: 11px;
            font-weight: bold;
            color: var(--text-color);
        }

        .item-btn {
            width: 100%;
            padding: 5px 0;
            font-size: 9px;
            font-weight: bold;
            font-family: inherit;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .item-btn.buy {
            background: var(--gold-neon);
            color: #000;
            box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
        }

        .item-btn.equip {
            background: var(--primary-neon);
            color: #000;
        }

        .item-btn.equipped {
            background: rgba(0, 255, 102, 0.15);
            color: var(--accent-neon);
            border: 1px solid var(--accent-neon);
            cursor: default;
        }

        .toast-msg {
            position: absolute;
            top: 15px;
            background: rgba(255, 0, 127, 0.95);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 0 15px var(--secondary-neon);
            z-index: 30;
            animation: fadeInOut 2s forwards;
        }

        /* MOBILE D-PAD CONTROLS */
        .mobile-controls {
            display: grid;
            grid-template-columns: repeat(3, 56px);
            grid-template-rows: repeat(3, 48px);
            gap: 6px;
            justify-content: center;
            align-items: center;
            margin-top: 4px;
            touch-action: none;
            width: 100%;
        }

        .dpad-btn {
            background: var(--card-bg);
            border: 2px solid rgba(0, 243, 255, 0.4);
            border-radius: 12px;
            color: var(--primary-neon);
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.15);
            transition: background 0.1s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }

        .dpad-btn:active {
            background: var(--primary-neon);
            color: #000;
            box-shadow: 0 0 18px var(--primary-neon);
            transform: scale(0.92);
        }

        #btnUp { grid-column: 2; grid-row: 1; }
        #btnLeft { grid-column: 1; grid-row: 2; }
        #btnDown { grid-column: 2; grid-row: 3; }
        #btnRight { grid-column: 3; grid-row: 2; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.08); opacity: 1; }
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-10px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div id="toast" class="toast-msg hidden">Not Enough Coins!</div>

        <!-- HUD Panel -->
        <div class="hud">

            <!-- COSMETIC SHOP OVERLAY -->
            <div id="shopScreen" class="overlay hidden">

                    <div style="font-size: 14px; font-weight: bold; color: var(--gold-neon);">COSMETIC SHOP</div>
                    <div style="font-size: 13px; color: var(--gold-neon); font-weight:bold;" id="shopCoinDisplay"><span class="gold-symbol">$</span> 0</div>

                <div class="preview-box">

    <script>
        /* ==========================================================================
           2. AUDIO SYNTHESIZER (WEB AUDIO API - NO EXTERNAL FILES)
           ========================================================================== */
        class SoundManager {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            }

            playTone(freq, type, duration, vol) {
                if (vol === undefined) vol = 0.1;
                this.init();
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }

            playEat() {
                this.playTone(440, 'sine', 0.08, 0.15);
                const self = this;
                setTimeout(function() { self.playTone(880, 'sine', 0.1, 0.15); }, 50);
            }

            playCoin() {
                this.playTone(987.77, 'triangle', 0.08, 0.2);
                const self = this;
                setTimeout(function() { self.playTone(1318.51, 'triangle', 0.15, 0.2); }, 60);
            }

            playDiamond() {
                this.playTone(523.25, 'square', 0.06, 0.12);
                const self = this;
                setTimeout(function() { self.playTone(659.25, 'square', 0.06, 0.12); }, 50);
                setTimeout(function() { self.playTone(783.99, 'square', 0.06, 0.12); }, 100);
                setTimeout(function() { self.playTone(1046.50, 'square', 0.15, 0.15); }, 150);
            }

            playGameOver() {
                this.playTone(300, 'sawtooth', 0.15, 0.2);
                const self = this;
                setTimeout(function() { self.playTone(220, 'sawtooth', 0.2, 0.2); }, 120);
                setTimeout(function() { self.playTone(150, 'sawtooth', 0.3, 0.25); }, 250);
            }

            playClick() {
                this.playTone(600, 'sine', 0.04, 0.08);
            }
        }

        const soundManager = new SoundManager();

        /* Helper function for robust rounded rectangle drawing without syntax errors */
        function drawRoundedRect(targetCtx, x, y, width, height, radius) {
            if (typeof targetCtx.roundRect === 'function') {
                targetCtx.beginPath();
                targetCtx.roundRect(x, y, width, height, radius);
            } else {
                targetCtx.beginPath();
                targetCtx.moveTo(x + radius, y);
                targetCtx.lineTo(x + width - radius, y);
                targetCtx.quadraticCurveTo(x + width, y, x + width, y + radius);
                targetCtx.lineTo(x + width, y + height - radius);
                targetCtx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                targetCtx.lineTo(x + radius, y + height);
                targetCtx.quadraticCurveTo(x, y + height, x, y + height - radius);
                targetCtx.lineTo(x, y + radius);
                targetCtx.quadraticCurveTo(x, y, x + radius, y);
                targetCtx.closePath();
            }
        }

        function initGame() {

            ];
            direction = { x: 1, y: 0 };

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
                valid = !snake.some(function(seg) { return seg.x === food.x && seg.y === food.y; });
            }

            if (Math.random() < 0.35 && coins.length < 2) {
                spawnCoin();
            }
            if (Math.random() < 0.20 && diamonds.length < 1) {
                spawnDiamond();
            }
        }

        function spawnCoin() {
            let pos;
            let valid = false;
            while (!valid) {
                pos = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
                valid = !snake.some(function(s) { return s.x === pos.x && s.y === pos.y; }) && food.x !== pos.x && food.y !== pos.y;
            }
            coins.push({ x: pos.x, y: pos.y, timer: 120 });
        }

        function spawnDiamond() {
            let pos;
            let valid = false;
            while (!valid) {
                pos = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
                valid = !snake.some(function(s) { return s.x === pos.x && s.y === pos.y; }) && food.x !== pos.x && food.y !== pos.y;
            }
            diamonds.push({ x: pos.x, y: pos.y, timer: 90 });
        }

        function handleInput(dirX, dirY) {
            if (gameState !== 'PLAYING') return;
            if (dirX !== 0 && direction.x === -dirX) return;
            if (dirY !== 0 && direction.y === -dirY) return;
            nextDirection = { x: dirX, y: dirY };
        }

        window.addEventListener('keydown', function(e) {
            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W': handleInput(0, -1); break;
                case 'ArrowDown': case 's': case 'S': handleInput(0, 1); break;
                case 'ArrowLeft': case 'a': case 'A': handleInput(-1, 0); break;
                case 'ArrowRight': case 'd': case 'D': handleInput(1, 0); break;
            }
        });

        let touchStartX = 0;
        let touchStartY = 0;
        canvas.addEventListener('touchstart', function(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        canvas.addEventListener('touchend', function(e) {
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 20) {
                handleInput(dx > 0 ? 1 : -1, 0);
            } else if (Math.abs(dy) > 20) {
                handleInput(0, dy > 0 ? 1 : -1);
            }
        }, { passive: true });

        document.getElementById('btnUp').addEventListener('click', function() { handleInput(0, -1); });
        document.getElementById('btnDown').addEventListener('click', function() { handleInput(0, 1); });
        document.getElementById('btnLeft').addEventListener('click', function() { handleInput(-1, 0); });
        document.getElementById('btnRight').addEventListener('click', function() { handleInput(1, 0); });

        /* ==========================================================================
           6. PARTICLE TRAIL & DEATH EFFECTS
           ========================================================================== */
        function spawnTrailEffect() {
            const effectType = equippedCosmetics.effect;
            if (effectType === 'effect_none' || snake.length === 0) return;

            if (effectParticles.length > 100) effectParticles.splice(0, 20);

            const tail = snake[snake.length - 1];
            const tx = tail.x * TILE_SIZE + TILE_SIZE / 2;
            const ty = tail.y * TILE_SIZE + TILE_SIZE / 2;

            if (effectType === 'effect_fire') {
                for (let i = 0; i < 2; i++) {
                    effectParticles.push({
                        type: 'fire',
                        x: tx + (Math.random() * 16 - 8),
                        y: ty + (Math.random() * 16 - 8),
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: -Math.random() * 2 - 0.5,
                        size: Math.random() * 6 + 6,
                        alpha: 1.0,
                        hue: Math.floor(Math.random() * 45)
                    });
                }
            } else if (effectType === 'effect_nature') {
                effectParticles.push({
                    type: 'leaf',
                    x: tx + (Math.random() * 16 - 8),
                    y: ty + (Math.random() * 16 - 8),
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5,
                    size: Math.random() * 5 + 5,
                    alpha: 1.0,
                    rot: Math.random() * Math.PI * 2
                });
            } else if (effectType === 'effect_water') {
                effectParticles.push({
                    type: 'water',
                    x: tx,
                    y: ty,
                    size: 4,
                    alpha: 0.9
                });
            } else if (effectType === 'effect_lightning') {
                effectParticles.push({
                    type: 'spark',
                    x: tx + (Math.random() * 16 - 8),
                    y: ty + (Math.random() * 16 - 8),
                    size: Math.random() * 5 + 3,
                    alpha: 1.0,
                    color: Math.random() < 0.5 ? '#00f3ff' : '#ffff00'
                });
            } else if (effectType === 'effect_ice') {
                effectParticles.push({
                    type: 'snow',
                    x: tx + (Math.random() * 18 - 9),
                    y: ty + (Math.random() * 18 - 9),
                    vx: (Math.random() - 0.5) * 1,
                    vy: Math.random() * 1.5 + 0.2,
                    size: Math.random() * 5 + 4,
                    alpha: 0.9
                });
            } else if (effectType === 'effect_magic') {
                effectParticles.push({
                    type: 'star',
                    x: tx + (Math.random() * 18 - 9),
                    y: ty + (Math.random() * 18 - 9),
                    size: Math.random() * 6 + 4,
                    alpha: 1.0,
                    rot: Math.random() * Math.PI
                });
            } else if (effectType === 'effect_rainbow') {
                effectParticles.push({
                    type: 'rainbow',
                    x: tx,
                    y: ty,
                    size: TILE_SIZE * 0.4,
                    alpha: 0.9,
                    hue: (Date.now() / 4) % 360
                });
            }
        }

        function updateEffectParticles() {
            effectParticles.forEach(function(p, idx) {
                if (p.vx !== undefined) p.x += p.vx;
                if (p.vy !== undefined) p.y += p.vy;
                if (p.type === 'water') p.size += 1.2;

                p.alpha -= 0.03;
                if (p.alpha <= 0) effectParticles.splice(idx, 1);
            });
        }

        function drawEffectParticles() {
            effectParticles.forEach(function(p) {
                if (p.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);

                if (p.type === 'fire') {
                    ctx.fillStyle = 'hsl(' + p.hue + ', 100%, 50%)';
                    ctx.shadowColor = 'hsl(' + p.hue + ', 100%, 50%)';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                } else if (p.type === 'leaf') {
                    ctx.fillStyle = '#00ff66';
                    ctx.shadowColor = '#00ff66';
                    ctx.shadowBlur = 8;
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, p.size, p.size * 0.4, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (p.type === 'water') {
                    ctx.strokeStyle = '#00f3ff';
                    ctx.lineWidth = 2;
                    ctx.shadowColor = '#00f3ff';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.stroke();
                } else if (p.type === 'spark') {
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 10;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                } else if (p.type === 'snow') {
                    ctx.fillStyle = '#a0e7ff';
                    ctx.shadowColor = '#00f3ff';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                } else if (p.type === 'star') {
                    ctx.fillStyle = '#ffd700';
                    ctx.shadowColor = '#ff007f';
                    ctx.shadowBlur = 10;
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                } else if (p.type === 'rainbow') {
                    ctx.fillStyle = 'hsl(' + p.hue + ', 100%, 60%)';
                    ctx.shadowColor = 'hsl(' + p.hue + ', 100%, 60%)';
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            });
        }

        /* ==========================================================================
           7. VECTOR COSMETICS ARTWORK SYSTEM (100% HAND-DRAWN CANVAS)
           ========================================================================== */
        function getSkinColors(skinId) {
            const s = COSMETICS.skin.find(function(item) { return item.id === skinId; }) || COSMETICS.skin[0];
            return { head: s.head, body: s.body };
        }

        function alignContextToDir(targetCtx, cx, cy, dir) {
            let angle = 0;
            if (dir.x === 1) angle = 0;
            else if (dir.x === -1) angle = Math.PI;
            else if (dir.y === 1) angle = Math.PI / 2;
            else if (dir.y === -1) angle = -Math.PI / 2;

            targetCtx.translate(cx, cy);
            targetCtx.rotate(angle);
        }

        function drawShapePath(targetCtx, x, y, size, shapeId, dir) {
            const cx = x + size / 2;
            const cy = y + size / 2;
            const r = size / 2 - 1;

            targetCtx.beginPath();
            switch (shapeId) {
                case 'shape_round':
                    targetCtx.arc(cx, cy, r, 0, Math.PI * 2);
                    targetCtx.fill();
                    break;

                case 'shape_square':
                    targetCtx.fillRect(x + 1, y + 1, size - 2, size - 2);
                    break;

                case 'shape_diamond':
                    targetCtx.moveTo(cx, y + 1);
                    targetCtx.lineTo(x + size - 1, cy);
                    targetCtx.lineTo(cx, y + size - 1);
                    targetCtx.lineTo(x + 1, cy);
                    targetCtx.closePath();
                    targetCtx.fill();
                    break;

                case 'shape_hexagon':
                    targetCtx.save();
                    targetCtx.translate(cx, cy);
                    targetCtx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const a = (i * 60) * Math.PI / 180;
                        targetCtx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                    }
                    targetCtx.closePath();
                    targetCtx.fill();
                    targetCtx.restore();
                    break;

                case 'shape_star':
                    targetCtx.save();
                    targetCtx.translate(cx, cy);
                    targetCtx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        targetCtx.lineTo(Math.cos((18 + i * 72) * Math.PI / 180) * r, -Math.sin((18 + i * 72) * Math.PI / 180) * r);
                        targetCtx.lineTo(Math.cos((54 + i * 72) * Math.PI / 180) * (r * 0.5), -Math.sin((54 + i * 72) * Math.PI / 180) * (r * 0.5));
                    }
                    targetCtx.closePath();
                    targetCtx.fill();
                    targetCtx.restore();
                    break;

                case 'shape_classic':
                default:
                    drawRoundedRect(targetCtx, x + 1, y + 1, size - 2, size - 2, 8);
                    targetCtx.fill();
                    break;
            }
        }

        function drawVectorFace(targetCtx, cx, cy, r, faceId) {
            targetCtx.save();
            targetCtx.fillStyle = '#05070a';
            targetCtx.strokeStyle = '#05070a';
            targetCtx.lineWidth = 2;
            targetCtx.lineCap = 'round';
            targetCtx.lineJoin = 'round';

            // +X adalah arah Depan (ujung kepala), -X adalah Belakang (leher/badan)
            switch (faceId) {
                case 'face_cute':
                    // Mata hitam berkilau
                    targetCtx.fillStyle = '#0a0a14';
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.25, -r * 0.3, r * 0.18, 0, Math.PI * 2);
                    targetCtx.arc(r * 0.25, r * 0.3, r * 0.18, 0, Math.PI * 2);
                    targetCtx.fill();

                    // Kilau putih di mata
                    targetCtx.fillStyle = '#ffffff';
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.32, -r * 0.35, r * 0.07, 0, Math.PI * 2);
                    targetCtx.arc(r * 0.32, r * 0.25, r * 0.07, 0, Math.PI * 2);
                    targetCtx.fill();

                    // Pipi merona (blush)
                    targetCtx.fillStyle = '#ff007f';
                    targetCtx.globalAlpha = 0.6;
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.1, -r * 0.55, r * 0.12, 0, Math.PI * 2);
                    targetCtx.arc(r * 0.1, r * 0.55, r * 0.12, 0, Math.PI * 2);
                    targetCtx.fill();
                    targetCtx.globalAlpha = 1.0;

                    // Mulut imut kucing 'w'
                    targetCtx.strokeStyle = '#05070a';
                    targetCtx.lineWidth = 1.8;
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.35, -r * 0.08, r * 0.08, 0, Math.PI);
                    targetCtx.arc(r * 0.35, r * 0.08, r * 0.08, 0, Math.PI);
                    targetCtx.stroke();
                    break;

                case 'face_cool':
                    // Cyber Visor Keren
                    targetCtx.fillStyle = '#05050a';
                    targetCtx.shadowColor = '#00f3ff';
                    targetCtx.shadowBlur = 10;
                    drawRoundedRect(targetCtx, r * 0.08, -r * 0.5, r * 0.42, r * 1.0, 4);
                    targetCtx.fill();

                    // Garis refleks kilau neon
                    targetCtx.strokeStyle = '#00f3ff';
                    targetCtx.lineWidth = 2.5;
                    targetCtx.beginPath();
                    targetCtx.moveTo(r * 0.2, -r * 0.4);
                    targetCtx.lineTo(r * 0.4, r * 0.4);
                    targetCtx.stroke();

                    // Senyum tipis percaya diri
                    targetCtx.strokeStyle = '#05070a';
                    targetCtx.lineWidth = 2;
                    targetCtx.shadowBlur = 0;
                    targetCtx.beginPath();
                    targetCtx.moveTo(r * 0.42, -r * 0.15);
                    targetCtx.lineTo(r * 0.52, r * 0.15);
                    targetCtx.stroke();
                    break;

                case 'face_happy':
                    // Mata lengkung ^_^
                    targetCtx.lineWidth = 2.5;
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.25, -r * 0.3, r * 0.15, -Math.PI * 0.85, -Math.PI * 0.15);
                    targetCtx.stroke();
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.25, r * 0.3, r * 0.15, -Math.PI * 0.85, -Math.PI * 0.15);
                    targetCtx.stroke();

                    // Mulut senyum lebar
                    targetCtx.fillStyle = '#05070a';
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.38, 0, r * 0.22, -Math.PI * 0.5, Math.PI * 0.5);
                    targetCtx.closePath();
                    targetCtx.fill();

                    // Lidah merah
                    targetCtx.fillStyle = '#ff0055';
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.45, 0, r * 0.1, 0, Math.PI * 2);
                    targetCtx.fill();
                    break;

                case 'face_excited':
                    // Mata Bintang Emas Binar
                    targetCtx.fillStyle = '#ffd700';
                    targetCtx.shadowColor = '#ffd700';
                    targetCtx.shadowBlur = 8;
                    const eyeYPositions = [-r * 0.3, r * 0.3];
                    for (let k = 0; k < eyeYPositions.length; k++) {
                        const eyeY = eyeYPositions[k];
                        targetCtx.beginPath();
                        for (let i = 0; i < 5; i++) {
                            const a1 = (i * 72 - 18) * Math.PI / 180;
                            const a2 = (i * 72 + 18) * Math.PI / 180;
                            targetCtx.lineTo(r * 0.25 + Math.cos(a1) * r * 0.18, eyeY + Math.sin(a1) * r * 0.18);
                            targetCtx.lineTo(r * 0.25 + Math.cos(a2) * r * 0.08, eyeY + Math.sin(a2) * r * 0.08);
                        }
                        targetCtx.closePath();
                        targetCtx.fill();
                    }

                    // Mulut Terbuka Ceria
                    targetCtx.fillStyle = '#05070a';
                    targetCtx.shadowBlur = 0;
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.4, 0, r * 0.2, 0, Math.PI * 2);
                    targetCtx.fill();
                    break;

                case 'face_nerd':
                    // Kacamata Tebal Nerd
                    targetCtx.strokeStyle = '#0a0a0f';
                    targetCtx.lineWidth = 2.5;
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.25, -r * 0.3, r * 0.2, 0, Math.PI * 2);
                    targetCtx.arc(r * 0.25, r * 0.3, r * 0.2, 0, Math.PI * 2);
                    targetCtx.moveTo(r * 0.25, -r * 0.1);
                    targetCtx.lineTo(r * 0.25, r * 0.1);
                    targetCtx.stroke();

                    // Pupil mata di balik kacamata
                    targetCtx.fillStyle = '#05070a';
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.28, -r * 0.3, r * 0.08, 0, Math.PI * 2);
                    targetCtx.arc(r * 0.28, r * 0.3, r * 0.08, 0, Math.PI * 2);
                    targetCtx.fill();

                    // Gigi kelinci miring khas nerd
                    targetCtx.fillStyle = '#ffffff';
                    targetCtx.fillRect(r * 0.42, -r * 0.08, r * 0.12, r * 0.16);
                    targetCtx.strokeRect(r * 0.42, -r * 0.08, r * 0.12, r * 0.16);
                    break;

                case 'face_smirk':
                    // Mata Miring Sassy / Senyum Sinis
                    targetCtx.fillStyle = '#05070a';
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.25, -r * 0.3, r * 0.12, 0, Math.PI * 2);
                    targetCtx.fill();

                    // Kedipan mata sebelah
                    targetCtx.lineWidth = 2;
                    targetCtx.beginPath();
                    targetCtx.moveTo(r * 0.15, r * 0.3);
                    targetCtx.lineTo(r * 0.32, r * 0.3);
                    targetCtx.stroke();

                    // Senyum miring menyamping
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.35, r * 0.1, r * 0.18, -Math.PI * 0.2, Math.PI * 0.6);
                    targetCtx.stroke();
                    break;

                case 'face_shy':
                    // Mata titik pemalu
                    targetCtx.fillStyle = '#05070a';
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.25, -r * 0.3, r * 0.09, 0, Math.PI * 2);
                    targetCtx.arc(r * 0.25, r * 0.3, r * 0.09, 0, Math.PI * 2);
                    targetCtx.fill();

                    // Pipi sangat merona
                    targetCtx.fillStyle = '#ff0033';
                    targetCtx.globalAlpha = 0.7;
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.12, -r * 0.48, r * 0.14, 0, Math.PI * 2);
                    targetCtx.arc(r * 0.12, r * 0.48, r * 0.14, 0, Math.PI * 2);
                    targetCtx.fill();
                    targetCtx.globalAlpha = 1.0;

                    // Mulut cemas bergelombang
                    targetCtx.strokeStyle = '#05070a';
                    targetCtx.lineWidth = 1.8;
                    targetCtx.beginPath();
                    targetCtx.moveTo(r * 0.35, -r * 0.1);
                    targetCtx.lineTo(r * 0.42, 0);
                    targetCtx.lineTo(r * 0.48, -r * 0.1);
                    targetCtx.stroke();
                    break;

                case 'face_crying':
                    // Mata sedih
                    targetCtx.fillStyle = '#05070a';
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.22, -r * 0.3, r * 0.11, 0, Math.PI * 2);
                    targetCtx.arc(r * 0.22, r * 0.3, r * 0.11, 0, Math.PI * 2);
                    targetCtx.fill();

                    // Air mata neon mengalir
                    targetCtx.fillStyle = '#00f3ff';
                    targetCtx.shadowColor = '#00f3ff';
                    targetCtx.shadowBlur = 6;
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.38, -r * 0.32, r * 0.09, 0, Math.PI * 2);
                    targetCtx.arc(r * 0.38, r * 0.32, r * 0.09, 0, Math.PI * 2);
                    targetCtx.fill();

                    // Mulut melengkung sedih
                    targetCtx.strokeStyle = '#05070a';
                    targetCtx.lineWidth = 2;
                    targetCtx.shadowBlur = 0;
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.45, 0, r * 0.15, Math.PI * 0.6, Math.PI * 1.4);
                    targetCtx.stroke();
                    break;

                case 'face_angry':
                    // Mata fokus
                    targetCtx.fillStyle = '#05070a';
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.25, -r * 0.28, r * 0.1, 0, Math.PI * 2);
                    targetCtx.arc(r * 0.25, r * 0.28, r * 0.1, 0, Math.PI * 2);
                    targetCtx.fill();

                    // Alis tajam marah
                    targetCtx.lineWidth = 2.5;
                    targetCtx.beginPath();
                    targetCtx.moveTo(r * 0.1, -r * 0.45);
                    targetCtx.lineTo(r * 0.35, -r * 0.18);
                    targetCtx.moveTo(r * 0.1, r * 0.45);
                    targetCtx.lineTo(r * 0.35, r * 0.18);
                    targetCtx.stroke();

                    // Mulut gemertak gigi
                    targetCtx.lineWidth = 1.8;
                    targetCtx.strokeRect(r * 0.38, -r * 0.18, r * 0.15, r * 0.36);
                    break;

                case 'face_sleepy':
                    // Mata terpejam Zzz
                    targetCtx.lineWidth = 2;
                    targetCtx.beginPath();
                    targetCtx.moveTo(r * 0.15, -r * 0.35);
                    targetCtx.lineTo(r * 0.32, -r * 0.22);
                    targetCtx.moveTo(r * 0.15, r * 0.35);
                    targetCtx.lineTo(r * 0.32, r * 0.22);
                    targetCtx.stroke();

                    // Tulisan Zzz glowing neon
                    targetCtx.strokeStyle = '#00f3ff';
                    targetCtx.lineWidth = 1.5;
                    targetCtx.shadowColor = '#00f3ff';
                    targetCtx.shadowBlur = 6;
                    targetCtx.beginPath();
                    targetCtx.moveTo(r * 0.42, -r * 0.3);
                    targetCtx.lineTo(r * 0.6, -r * 0.3);
                    targetCtx.lineTo(r * 0.42, -r * 0.05);
                    targetCtx.lineTo(r * 0.6, -r * 0.05);
                    targetCtx.stroke();
                    break;

                case 'face_surprised':
                    // Mata melotot terkejut
                    targetCtx.fillStyle = '#05070a';
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.25, -r * 0.3, r * 0.14, 0, Math.PI * 2);
                    targetCtx.arc(r * 0.25, r * 0.3, r * 0.14, 0, Math.PI * 2);
                    targetCtx.fill();

                    // Mulut bundar 'O'
                    targetCtx.lineWidth = 2;
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.42, 0, r * 0.15, 0, Math.PI * 2);
                    targetCtx.stroke();
                    break;

                case 'face_crazy':
                    // Mata berputar/miring beda ukuran
                    targetCtx.lineWidth = 1.8;
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.22, -r * 0.3, r * 0.16, 0, Math.PI * 2);
                    targetCtx.stroke();
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.28, r * 0.3, r * 0.1, 0, Math.PI * 2);
                    targetCtx.fill();

                    // Lidah melet menjulur
                    targetCtx.fillStyle = '#ff0055';
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.48, r * 0.12, r * 0.12, 0, Math.PI * 2);
                    targetCtx.fill();
                    break;

                case 'face_angel':
                    // Lingkaran Halo Malaikat di atas dahi
                    targetCtx.strokeStyle = '#ffd700';
                    targetCtx.lineWidth = 2.5;
                    targetCtx.shadowColor = '#ffd700';
                    targetCtx.shadowBlur = 10;
                    targetCtx.beginPath();
                    targetCtx.ellipse(r * 0.2, 0, r * 0.12, r * 0.42, 0, 0, Math.PI * 2);
                    targetCtx.stroke();

                    // Mata tersenyum lembut
                    targetCtx.strokeStyle = '#05070a';
                    targetCtx.lineWidth = 2;
                    targetCtx.shadowBlur = 0;
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.25, -r * 0.3, r * 0.12, -Math.PI * 0.8, -Math.PI * 0.2);
                    targetCtx.arc(r * 0.25, r * 0.3, r * 0.12, -Math.PI * 0.8, -Math.PI * 0.2);
                    targetCtx.stroke();

                    // Senyum lembut
                    targetCtx.beginPath();
                    targetCtx.arc(r * 0.4, 0, r * 0.16, -Math.PI * 0.4, Math.PI * 0.4);
                    targetCtx.stroke();
                    break;
            }

            targetCtx.restore();
        }

        function drawVectorHat(targetCtx, cx, cy, r, hatId) {
            if (hatId === 'hat_none') return;

            targetCtx.save();

            // Posisi Topi tepat di atas tengah-ke-belakang kepala (-X), menutupi sambungan badan [badan]["topi"[:)]
            switch (hatId) {
                case 'hat_cap':
                    // Cyber Cap (Pet Topi)
                    targetCtx.fillStyle = '#ff007f';
                    targetCtx.shadowColor = '#ff007f';
                    targetCtx.shadowBlur = 8;
                    targetCtx.beginPath();
                    targetCtx.arc(-r * 0.25, 0, r * 0.65, Math.PI * 0.4, Math.PI * 1.6);
                    targetCtx.fill();

                    // Visor Cap ke depan
                    targetCtx.fillStyle = '#00f3ff';
                    targetCtx.fillRect(-r * 0.25, -r * 0.65, r * 0.55, r * 0.22);
                    break;

                case 'hat_crown':
                    // Mahkota Emas Kerajaan
                    targetCtx.fillStyle = '#ffd700';
                    targetCtx.shadowColor = '#ffd700';
                    targetCtx.shadowBlur = 10;
                    targetCtx.beginPath();
                    targetCtx.moveTo(-r * 0.1, -r * 0.65);
                    targetCtx.lineTo(-r * 0.8, -r * 0.65);
                    targetCtx.lineTo(-r * 0.4, -r * 0.25);
                    targetCtx.lineTo(-r * 0.95, 0);
                    targetCtx.lineTo(-r * 0.4, r * 0.25);
                    targetCtx.lineTo(-r * 0.8, r * 0.65);
                    targetCtx.lineTo(-r * 0.1, r * 0.65);
                    targetCtx.closePath();
                    targetCtx.fill();

                    // Permata Merah pada Mahkota
                    targetCtx.fillStyle = '#ff0055';
                    targetCtx.beginPath();
                    targetCtx.arc(-r * 0.95, 0, r * 0.08, 0, Math.PI * 2);
                    targetCtx.arc(-r * 0.8, -r * 0.65, r * 0.07, 0, Math.PI * 2);
                    targetCtx.arc(-r * 0.8, r * 0.65, r * 0.07, 0, Math.PI * 2);
                    targetCtx.fill();
                    break;

                case 'hat_wizard':
                    // Topi Penyihir Kerucut
                    targetCtx.fillStyle = '#3a0ca3';
                    targetCtx.shadowColor = '#4cc9f0';
                    targetCtx.shadowBlur = 10;

                    // Pinggiran topi (brim)
                    targetCtx.beginPath();
                    targetCtx.ellipse(-r * 0.2, 0, r * 0.28, r * 0.8, 0, 0, Math.PI * 2);
                    targetCtx.fill();

                    // Kerucut topi mengarah ke belakang
                    targetCtx.beginPath();
                    targetCtx.moveTo(-r * 0.2, -r * 0.5);
                    targetCtx.lineTo(-r * 1.25, 0);
                    targetCtx.lineTo(-r * 0.2, r * 0.5);
                    targetCtx.closePath();
                    targetCtx.fill();

                    // Bintang Emas di Topi
                    targetCtx.fillStyle = '#ffd700';
                    targetCtx.beginPath();
                    targetCtx.arc(-r * 0.65, 0, r * 0.12, 0, Math.PI * 2);
                    targetCtx.fill();
                    break;

                case 'hat_cowboy':
                    // Topi Koboi Cokelat
                    targetCtx.fillStyle = '#8b5a2b';
                    targetCtx.shadowColor = '#8b5a2b';
                    targetCtx.shadowBlur = 6;
                    targetCtx.beginPath();
                    targetCtx.ellipse(-r * 0.2, 0, r * 0.32, r * 0.9, 0, 0, Math.PI * 2);
                    targetCtx.fill();

                    targetCtx.fillRect(-r * 0.75, -r * 0.42, r * 0.55, r * 0.84);
                    targetCtx.fillStyle = '#5c3a1e';
                    targetCtx.fillRect(-r * 0.35, -r * 0.42, r * 0.12, r * 0.84);
                    break;

                case 'hat_party':
                    // Topi Pesta
                    targetCtx.fillStyle = '#ff007f';
                    targetCtx.shadowColor = '#ff007f';
                    targetCtx.shadowBlur = 8;
                    targetCtx.beginPath();
                    targetCtx.moveTo(-r * 0.1, -r * 0.45);
                    targetCtx.lineTo(-r * 1.15, 0);
                    targetCtx.lineTo(-r * 0.1, r * 0.45);
                    targetCtx.closePath();
                    targetCtx.fill();

                    // Strip Kuning
                    targetCtx.strokeStyle = '#ffd700';
                    targetCtx.lineWidth = 2.5;
                    targetCtx.beginPath();
                    targetCtx.moveTo(-r * 0.45, -r * 0.25);
                    targetCtx.lineTo(-r * 0.45, r * 0.25);
                    targetCtx.stroke();

                    // Bola Pom-pom di Ujung Topi
                    targetCtx.fillStyle = '#00f3ff';
                    targetCtx.beginPath();
                    targetCtx.arc(-r * 1.2, 0, r * 0.12, 0, Math.PI * 2);
                    targetCtx.fill();

            targetCtx.restore();
        }

        function drawVectorOutfit(targetCtx, cx, cy, r, outfitId) {

        function drawSnakeSegment(targetCtx, segment, isHead, colors, shapeId, cosmetics, dir, tileSize) {
            if (tileSize === undefined) tileSize = TILE_SIZE;
            const x = segment.x * tileSize;
            const y = segment.y * tileSize;
            const cx = x + tileSize / 2;
            const cy = y + tileSize / 2;
            const r = tileSize / 2;

            targetCtx.save();
            targetCtx.fillStyle = isHead ? colors.head : colors.body;
            targetCtx.shadowColor = isHead ? colors.head : colors.body;
            targetCtx.shadowBlur = isHead ? 14 : 8;

            drawShapePath(targetCtx, x, y, tileSize, shapeId, dir);

            targetCtx.save();
            alignContextToDir(targetCtx, cx, cy, dir);

            if (!isHead && cosmetics.outfit && cosmetics.outfit !== 'outfit_none') {
                drawVectorOutfit(targetCtx, 0, 0, r, cosmetics.outfit);
            }

            if (isHead) {
                drawVectorHat(targetCtx, 0, 0, r, cosmetics.hat);
                drawVectorFace(targetCtx, 0, 0, r, cosmetics.face);
            }

            targetCtx.restore();
            targetCtx.restore();
        }

        /* ==========================================================================
           8. COLLECTIBLES DRAWING (FOOD, GOLD COINS, DIAMONDS)
           ========================================================================== */
        function drawFood() {
            const fx = food.x * TILE_SIZE + TILE_SIZE / 2;
            const fy = food.y * TILE_SIZE + TILE_SIZE / 2;
            const r = TILE_SIZE / 2 - 2;

            ctx.save();
            const scale = 1 + Math.sin(globalAnimTime * 0.08) * 0.08;
            ctx.translate(fx, fy);
            ctx.scale(scale, scale);

            ctx.fillStyle = '#ff0055';
            ctx.shadowColor = '#ff0055';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(0, 2, r * 0.85, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#00ff66';
            ctx.shadowColor = '#00ff66';
            ctx.beginPath();
            ctx.ellipse(r * 0.2, -r * 0.7, r * 0.35, r * 0.18, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#8b5a2b';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -r * 0.3);
            ctx.lineTo(0, -r * 0.7);
            ctx.stroke();

            ctx.restore();
        }

        function drawGoldCoins() {
            coins.forEach(function(c) {
                const cx = c.x * TILE_SIZE + TILE_SIZE / 2;
                const cy = c.y * TILE_SIZE + TILE_SIZE / 2;
                const r = TILE_SIZE / 2 - 3;

                ctx.save();
                ctx.translate(cx, cy);

                const spinScale = Math.abs(Math.sin(globalAnimTime * 0.1));
                ctx.scale(spinScale < 0.15 ? 0.15 : spinScale, 1);

                ctx.fillStyle = '#ffd700';
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 14;
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#cc9900';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, r * 0.7, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = '#05070a';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('$', 0, 1);

                ctx.restore();
            });
        }

        function drawDiamonds() {
            diamonds.forEach(function(d) {
                const cx = d.x * TILE_SIZE + TILE_SIZE / 2;
                const cy = d.y * TILE_SIZE + TILE_SIZE / 2;
                const r = TILE_SIZE / 2 - 2;

                ctx.save();
                ctx.translate(cx, cy);

                const bob = Math.sin(globalAnimTime * 0.12) * 3;
                ctx.translate(0, bob);

                ctx.fillStyle = '#00f3ff';
                ctx.shadowColor = '#00f3ff';
                ctx.shadowBlur = 18;

                ctx.beginPath();
                ctx.moveTo(0, -r);
                ctx.lineTo(r, -r * 0.3);
                ctx.lineTo(0, r);
                ctx.lineTo(-r, -r * 0.3);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(0, -r);
                ctx.lineTo(r * 0.4, -r * 0.3);
                ctx.lineTo(0, 0);
                ctx.lineTo(-r * 0.4, -r * 0.3);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            });
        }

        /* ==========================================================================
           9. GAMEPLAY UPDATE & COLLISION SYSTEM
           ========================================================================== */
        function updateSnake() {
            direction = nextDirection;
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                triggerDeath();
                return;
            }

            if (snake.some(function(seg) { return seg.x === head.x && seg.y === head.y; })) {
                triggerDeath();
                return;
            }

            snake.unshift(head);
            spawnTrailEffect();

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                soundManager.playEat();
                spawnFood();
            } else {
                snake.pop();
            }

            coins.forEach(function(c, idx) {
                c.timer--;
                if (head.x === c.x && head.y === c.y) {
                    coinsEarnedThisGame += 5;
                    totalCoins += 5;
                    soundManager.playCoin();
                    coins.splice(idx, 1);
                    updateUIHeader();
                } else if (c.timer <= 0) {
                    coins.splice(idx, 1);
                }
            });

            diamonds.forEach(function(d, idx) {
                d.timer--;
                if (head.x === d.x && head.y === d.y) {
                    score += 25;
                    coinsEarnedThisGame += 15;
                    totalCoins += 15;
                    soundManager.playDiamond();
                    diamonds.splice(idx, 1);
                    updateUIHeader();
                } else if (d.timer <= 0) {
                    diamonds.splice(idx, 1);
                }
            });

            if (score > highScore) {
                highScore = score;
                isNewHighScore = true;
            }

            updateUIHeader();
        }

        function triggerDeath() {
            gameState = 'GAMEOVER';
            soundManager.playGameOver();

            const head = snake[0];
            const hx = head.x * TILE_SIZE + TILE_SIZE / 2;
            const hy = head.y * TILE_SIZE + TILE_SIZE / 2;

            for (let i = 0; i < 40; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                deathParticles.push({
                    x: hx,
                    y: hy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: Math.random() < 0.5 ? '#ff007f' : '#00f3ff',
                    size: Math.random() * 6 + 4,
                    alpha: 1.0
                });
            }

            saveData();

            setTimeout(function() {
                finalScoreEl.textContent = score;
                coinsEarnedEl.textContent = '+$ ' + coinsEarnedThisGame;
                finalHighScoreEl.textContent = highScore;

                if (isNewHighScore) {
                    newHighBadgeEl.classList.remove('hidden');
                } else {
                    newHighBadgeEl.classList.add('hidden');
                }

                gameOverScreenEl.classList.remove('hidden');
            }, 600);
        }

        function updateDeathParticles() {
            deathParticles.forEach(function(p, idx) {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;
                if (p.alpha <= 0) deathParticles.splice(idx, 1);
            });
        }

        function drawDeathParticles() {
            deathParticles.forEach(function(p) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        /* ==========================================================================
           10. MAIN RENDER LOOP
           ========================================================================== */
        function drawGrid() {
            ctx.save();
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.04)';
            ctx.lineWidth = 1;

            for (let i = 0; i <= CANVAS_SIZE; i += TILE_SIZE) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, CANVAS_SIZE);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(CANVAS_SIZE, i);
                ctx.stroke();
            }
            ctx.restore();
        }

        function gameStep(timestamp) {
            globalAnimTime++;

            if (gameState === 'PLAYING') {
                if (timestamp - lastStepTime >= stepInterval) {
                    updateSnake();
                    lastStepTime = timestamp;
                }
            }

            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            drawGrid();

            if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
                updateEffectParticles();
                drawEffectParticles();

                drawFood();
                drawGoldCoins();
                drawDiamonds();

                const colors = getSkinColors(equippedCosmetics.skin);
                for (let i = snake.length - 1; i >= 0; i--) {
                    drawSnakeSegment(
                        ctx,
                        snake[i],
                        i === 0,
                        colors,
                        equippedCosmetics.bodyShape,
                        equippedCosmetics,
                        direction
                    );
                }

                if (deathParticles.length > 0) {
                    updateDeathParticles();
                    drawDeathParticles();
                }
            }

            updatePreviewCanvas();
            requestAnimationFrame(gameStep);
        }

        /* ==========================================================================
           11. SHOP & PREVIEW SYSTEM
           ========================================================================== */
        function renderShopGrid() {
            shopGrid.innerHTML = '';
            const list = COSMETICS[activeTab] || [];

            list.forEach(function(item) {
                const card = document.createElement('div');
                const isOwned = ownedCosmetics.indexOf(item.id) !== -1;
                const isEquipped = equippedCosmetics[activeTab] === item.id;
                const isSelected = previewCosmetics[activeTab] === item.id;

                card.className = 'shop-item-card ' + (isEquipped ? 'equipped ' : '') + (isSelected ? 'selected-preview' : '');

                let btnHtml = '';
                if (isEquipped) {
                    btnHtml = '<button class="item-btn equipped">EQUIPPED</button>';
                } else if (isOwned) {
                    btnHtml = '<button class="item-btn equip">EQUIP</button>';
                } else {
                    btnHtml = '<button class="item-btn buy"><span class="gold-symbol">$</span> ' + item.price + '</button>';
                }

                card.innerHTML = '<span class="item-name">' + item.name + '</span>' + btnHtml;

                card.addEventListener('click', function() {
                    soundManager.playClick();
                    previewCosmetics[activeTab] = item.id;
                    if (isOwned) {
                        equippedCosmetics[activeTab] = item.id;
                        saveData();
                    } else {
                        if (totalCoins >= item.price) {
                            totalCoins -= item.price;
                            ownedCosmetics.push(item.id);
                            equippedCosmetics[activeTab] = item.id;
                            saveData();
                            updateUIHeader();
                        } else {
                            showToast("Not Enough Coins!");
                        }
                    }
                    renderShopGrid();
                });

                shopGrid.appendChild(card);
            });
        }

        function updatePreviewCanvas() {
            if (shopScreenEl.classList.contains('hidden')) return;

            previewCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);

            const pTileSize = 36;
            const colors = getSkinColors(previewCosmetics.skin);
            const previewSnake = [
                { x: 4.8, y: 0.2 },
                { x: 3.5, y: 0.2 },
                { x: 2.2, y: 0.2 }
            ];

            for (let i = previewSnake.length - 1; i >= 0; i--) {
                drawSnakeSegment(
                    previewCtx,
                    previewSnake[i],
                    i === 0,
                    colors,
                    previewCosmetics.bodyShape,
                    previewCosmetics,
                    { x: 1, y: 0 },
                    pTileSize
                );
            }
        }

        /* ==========================================================================
           12. EVENT BINDINGS
           ========================================================================== */
        document.getElementById('startBtn').addEventListener('click', function() {
            soundManager.playClick();
            startScreenEl.classList.add('hidden');
            initGame();
            gameState = 'PLAYING';
        });

        document.getElementById('restartBtn').addEventListener('click', function() {
            soundManager.playClick();
            gameOverScreenEl.classList.add('hidden');
            initGame();
            gameState = 'PLAYING';
        });

        const shopBtns = [document.getElementById('shopBtnStart'), document.getElementById('shopBtnOver')];
        shopBtns.forEach(function(btn) {
            if (!btn) return;
            btn.addEventListener('click', function() {
                soundManager.playClick();
                previewCosmetics = Object.assign({}, equippedCosmetics);
                shopScreenEl.classList.remove('hidden');
                renderShopGrid();
            });
        });

        document.getElementById('closeShopBtn').addEventListener('click', function() {
            soundManager.playClick();
            shopScreenEl.classList.add('hidden');
        });

        const tabBtns = document.querySelectorAll('.tab-btn');
        tabBtns.forEach(function(tab) {
            tab.addEventListener('click', function() {
                soundManager.playClick();
                tabBtns.forEach(function(t) { t.classList.remove('active'); });
                tab.classList.add('active');
                activeTab = tab.getAttribute('data-tab');
                renderShopGrid();
            });
        });

        // Initialize saved data and start canvas game loop
        loadSavedData();
        requestAnimationFrame(gameStep);
    </script>
</body>
</html>
